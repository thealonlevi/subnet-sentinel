name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build binaries
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o subnet-sentinel-linux-amd64 ./cmd/subnet-sentinel
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o subnet-sentinel-linux-arm64 ./cmd/subnet-sentinel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            subnet-sentinel-linux-amd64
            subnet-sentinel-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
